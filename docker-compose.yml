services:
  postgres:
    image: postgres:16-alpine
    container_name: mission-pipeline-pg
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: mission
      POSTGRES_PASSWORD: mission
      POSTGRES_DB: mission
    volumes:
      - mission_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mission -d mission"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mission_pgdata:
